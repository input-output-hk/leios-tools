[package]
name = "txflow"
version = "0.1.0"
edition = "2021"
description = "Declarative transaction-flow experiments: expand a UTxO-graph spec into a symbolic IR and materialise it offline into signed transactions."

[[bin]]
name = "txflow"
path = "src/main.rs"

[dependencies]
pallas-txbuilder = "=1.4.0"
pallas-crypto = "=1.4.0"
pallas-addresses = "=1.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
thiserror = "2"

[dev-dependencies]
pallas-traverse = "=1.4.0"
