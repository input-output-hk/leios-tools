[package]
name = "shared-vrf"
version = "0.1.0"
edition = "2021"
description = "Cardano Praos VRF for Leios block production: a byte-oriented draft-03 prover + verifier (over pallas_vrf), plus the `praos` leader-election glue (VRF input, leader-value derivation, and the exact stake-weighted leadership threshold)."

[dependencies]
# Cardano-compatible draft-03 VRF. Pure-Rust (no C bindings), but consumed
# as a git dependency pinned by rev — the same crate and rev Acropolis uses.
# It is not published to crates.io and transitively pins a forked
# curve25519-dalek (the Elligator2 sign-flip Cardano's draft-03 needs).
# We pin by rev (rather than vendoring) to track exactly what Acropolis
# validates with; commit Cargo.lock so the resolved commits of pallas_vrf AND
# its dalek fork stay reproducible even if the upstream branch moves or the
# repo disappears.
pallas_vrf = { git = "https://github.com/txpipe/vrf", rev = "62ef4c7252ed05df98611da191e20c0dd144f025" }

# Praos leader-election glue (the `praos` module): the VRF input and
# leader-value constructions (blake2b-256) and the exact leadership
# threshold check. The threshold uses the same fixed-point Taylor
# comparison as cardano-base, via `pallas-math` — pinned to the version
# Acropolis validates the real chain with — rather than an f64
# approximation, so the win/lose boundary matches the real node. These
# Cardano-facing deps live here (node-only), not in `shared-consensus`
# (which is shared with sim-rs and stays lean).
blake2b_simd = "1"
pallas-math = "=0.34.0"
dashu-int = "0.4.1"

[dev-dependencies]
hex = "0.4"
