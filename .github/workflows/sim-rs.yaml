name: "sim-rs"

on:
  pull_request:
    paths:
      - "data/**"
      - "sim-rs/**"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "sim-rs/**"

# Least privilege: this workflow only checks out and builds/tests, so read
# access is all the GITHUB_TOKEN needs.
permissions:
  contents: read

jobs:
  sim-rs-check:
    name: "Test"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.92.0"
          cache-workspaces: sim-rs
      - name: Test Rust packages
        working-directory: sim-rs
        run: |
          cargo test
          if [ $? -ne 0 ]; then
            echo "Cargo test failed"
            exit 1
          fi
