name: codex-review

# Trusted orchestration only: PR code is data and is never executed.
# Forks require an explicit @codex review comment from a maintainer.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  gate:
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request_target' &&
         !github.event.pull_request.draft &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '@codex review')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      pr: ${{ steps.gate.outputs.pr }}
      head: ${{ steps.gate.outputs.head }}
      base: ${{ steps.gate.outputs.base }}
      requested: ${{ steps.gate.outputs.requested }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: gate
        name: Authorize review and resolve immutable commits
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: python3 .github/codex-review/review.py gate

  review:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: codex-analyze-${{ needs.gate.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      state: ${{ steps.prepare.outputs.state }}
      mode: ${{ steps.prepare.outputs.mode }}
      findings: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check out trusted review tools
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out PR source as review data
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.gate.outputs.head }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare review context
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
          HEAD: ${{ needs.gate.outputs.head }}
          BASE: ${{ needs.gate.outputs.base }}
          REQUESTED: ${{ needs.gate.outputs.requested }}
        run: python3 trusted/.github/codex-review/review.py prepare
      # Keep Codex last. The job has no GitHub write token; the API key is
      # scoped to the action's protected Responses API proxy.
      - name: Review with Codex
        if: steps.prepare.outputs.state == 'review'
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.164.0'
          model: ${{ vars.CODEX_REVIEW_MODEL || 'gpt-6.1-sol' }}
          effort: high
          safety-strategy: drop-sudo
          permission-profile: ':read-only'
          working-directory: ${{ github.workspace }}
          codex-home: ${{ runner.temp }}/codex-review-home
          prompt-file: trusted/.github/codex-review/prompt.md
          output-schema-file: trusted/.github/codex-review/schema.json
          codex-args: '["-c", "project_doc_max_bytes=0"]'

  publish:
    needs: [gate, review]
    if: always() && needs.gate.outputs.head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: codex-publish-${{ needs.gate.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Check out trusted publisher only
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate and post review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
          HEAD: ${{ needs.gate.outputs.head }}
          BASE: ${{ needs.gate.outputs.base }}
          REQUESTED: ${{ needs.gate.outputs.requested }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PREPARE_STATE: ${{ needs.review.outputs.state }}
          REVIEW_MODE: ${{ needs.review.outputs.mode }}
          REVIEW_JSON: ${{ needs.review.outputs.findings }}
        run: python3 .github/codex-review/review.py publish
